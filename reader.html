<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title></title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="reader-page">
<section id="reader">
    <div id="view">
        <div id="stage">
            <span id="load"></span>
            <div class="zone" id="zl" aria-label="左のページへ"></div>
            <div class="zone" id="zr" aria-label="右のページへ"></div>
            <div id="pages" class="single rtl"></div>
        </div>
        <div id="end" hidden>
            <span id="endmsg">この巻は読み終わりました</span>
            <a class="btn" id="endprev" hidden></a>
            <a class="btn pri" id="endnext" hidden></a>
            <a class="btn" data-back href="index.html">一覧へ</a>
        </div>
    </div>
    <div id="bar">
        <a class="btn" id="back" data-back href="index.html">一覧へ</a>
        <span id="ttl"></span>
        <button id="mode">単ページ</button>
        <button id="dir">右開き</button>
        <button id="fit">全体表示</button>
        <button id="fs">全画面</button>
        <input type="range" id="seek" min="1" max="1" value="1" aria-label="ページ位置">
        <span id="cnt">0 / 0</span>
    </div>
</section>
<script src="config.js?v=3"></script>
<script src="drive.js?v=3"></script>
<script src="reader.js?v=3"></script>
</body>
</html>
